[package]
name = "extera-core"
version = "0.1.0"
edition = "2021"
authors = ["exteraGram Rust Team"]
description = "High-performance Telegram engine and Extera customization core written in Rust"

[lib]
name = "extera_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
log = "0.4"
