name: Build ExteraLight APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ExteraLight Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Fetch TDLib Android AAR
        run: |
          mkdir -p app/libs
          if [ ! -f "app/libs/tdlib.aar" ]; then
            echo "Downloading prebuilt TDLib 1.8 AAR..."
            curl -sSL "https://github.com/FaiBah/TDLibAndroidPrebuilt/releases/download/v1.8.69-4c6377a-Java/tdlib.aar" -o app/libs/tdlib.aar
          fi
          ls -lh app/libs/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p release_output
          find app/build/outputs/apk -name "*.apk" -exec cp {} release_output/ExteraLight-v1.0.0.apk \;
          ls -lh release_output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExteraLight-v1.0.0.apk
          path: release_output/ExteraLight-v1.0.0.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.2.0
          name: "ExteraLight v1.0.0 (Material You Telegram)"
          body: |
            ### ⚡ ExteraLight Mobile (No Bloat, Pure Material You)
            
            - **Отказ от лишнего**: Никакого визуального мусора, лагающих шейдеров размытия и гигантского веса.
            - **Material Design 3 (Material You)**: Чистая динамическая палитра Monet из обоев смартфона, аккуратные карточки и нативная типографика.
            - **Плагины Extera**:
              - 👻 **Ghost Mode**: скрытие прочтения и статуса набора текста.
              - 🛡️ **Anti-Delete**: сохранение удаленных сообщений.
              - 🏷️ **ID Inspector & Datacenter Info**: отображение Telegram ID и DC серверов (DC1–DC5) в профилях и сообщениях.
            - **🥚 Пасхалки**:
              - Нажмите 5 раз на версию в настройках, чтобы активировать **ExteraLight God Mode**!
            
            📲 **Установка:** Скачайте `ExteraLight-v1.0.0.apk` ниже.
          files: release_output/ExteraLight-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
