name: Build ExteraGram Rust APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK with TDLib and Rust Core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Compile Rust Core (libextera_core.so)
        run: |
          mkdir -p app/src/main/jniLibs
          cd extera-core
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../app/src/main/jniLibs build --release
          cd ..
          ls -R app/src/main/jniLibs

      - name: Fetch TDLib Android AAR
        run: |
          mkdir -p app/libs
          if [ ! -f "app/libs/tdlib.aar" ]; then
            echo "Downloading prebuilt TDLib 1.8 AAR..."
            curl -sSL "https://github.com/FaiBah/TDLibAndroidPrebuilt/releases/download/v1.8.69-4c6377a-Java/tdlib.aar" -o app/libs/tdlib.aar
          fi
          ls -lh app/libs/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p release_output
          find app/build/outputs/apk -name "*.apk" -exec cp {} release_output/exteragram-rust-v1.1.0.apk \;
          ls -lh release_output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: exteragram-rust-v1.1.0.apk
          path: release_output/exteragram-rust-v1.1.0.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.0
          name: "exteraGram Rust & TDLib v1.1.0 (Full Telegram Client)"
          body: |
            ### 🚀 Полноценный клиент Telegram на Rust + TDLib
            
            - **Реальный Telegram**: полноценная авторизация по номеру телефона / коду / 2FA паролю.
            - **Ядро на Rust**: `libextera_core.so` (перехватчик Ghost-режима, блокировка отчетов о прочтении, анти-удаление сообщений).
            - **Интерфейс**: Jetpack Compose + Material Design 3 + Liquid Glass (матовое стекло, размытие, блики).
            - **Настройки extera**: полный контроль Ghost Mode, слайдеры стекла, темы Monet, скругление пузырей.
            
            📲 **Установка:** Скачайте `exteragram-rust-v1.1.0.apk` ниже и установите на Android.
          files: release_output/exteragram-rust-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
